<script>
const $=s=>document.querySelector(s),R=Math.random,fm=n=>'$'+Math.round(n)+'k',pc=x=>(x*100).toFixed(1)+'%';
const AX=['Economía (Estado ↔ Mercado)','Social (Progresista ↔ Tradicional)','Institucional (Libertad ↔ Autoridad)','Nacionalismo (Global ↔ Nacional)'];
const PN={S:'Seguridad ciudadana',D:'Desempleo',I:'Infraestructura y vías',G:'Desigualdad',P:'Servicios públicos',M:'Movilidad urbana',V:'Acceso a vivienda',C:'Contaminación',H:'Salud',E:'Educación',A:'Agro y precios',X:'Extractivismo (petróleo/minería)',T:'Dependencia del turismo',R:'Pobreza rural',N:'Migración',K:'Desastres naturales',W:'Conectividad'};
// [nombre, población aprox. (millones), región, 5 problemas, polígono ESQUEMÁTICO]
const PV=[
['Azuay',.83,'s','NVSCD','82,92 95,95 105,100 95,115 100,128 82,125 75,112 80,108'],
['Bolívar',.20,'s','RAWEH','68,78 85,80 82,92 60,92'],
['Cañar',.28,'s','NRASP','60,92 82,92 80,108 65,112 62,110'],
['Carchi',.17,'s','SNDIA','95,12 120,8 125,25 100,30 85,35'],
['Chimborazo',.53,'s','RAEHG','85,80 105,72 105,82 118,80 118,92 95,95 82,92'],
['Cotopaxi',.47,'s','ARKED','70,65 100,62 105,72 85,80 68,78'],
['El Oro',.72,'c','SDIXP','40,135 55,125 62,110 65,112 75,125 72,145 55,150 38,145'],
['Esmeraldas',.55,'c','SDPGI','30,10 70,0 95,12 85,35 60,45 35,40 25,25'],
['Galápagos',.03,'g','CPVTW','4,166 30,162 34,176 22,192 6,188'],
['Guayas',4.39,'c','SDIGP','30,95 48,85 60,92 62,110 55,125 40,135 25,118 22,105'],
['Imbabura',.47,'s','ADSRI','85,35 100,30 125,25 130,40 105,48 90,45'],
['Loja',.52,'s','NDAIE','55,150 72,145 82,125 100,128 98,150 90,168 70,170 52,162'],
['Los Ríos',.90,'c','SKAPD','50,62 70,65 68,78 60,92 48,85'],
['Manabí',1.52,'c','KSDIP','15,45 35,40 38,58 50,62 48,85 30,95 12,75 8,58'],
['Morona Santiago',.18,'a','WXHER','118,92 140,100 150,125 125,140 100,128 95,115 105,100 95,95'],
['Napo',.13,'a','WXHED','105,48 130,40 140,38 145,58 120,68 100,62'],
['Orellana',.16,'a','XCHID','140,38 175,35 180,60 150,70 145,58'],
['Pastaza',.11,'a','WEHXR','120,68 145,58 150,70 165,85 140,100 118,92 118,80'],
['Pichincha',3.09,'s','MVSCD','60,45 85,35 90,45 105,48 100,62 70,65 55,55'],
['Santa Elena',.37,'c','PDSTI','10,92 30,95 22,105 25,118 8,112 3,100'],
['Santo Domingo de los Tsáchilas',.45,'c','SDPIV','45,48 60,45 55,55 50,62 38,58'],
['Sucumbíos',.23,'a','SXCNH','120,8 150,0 180,15 175,35 140,38 125,25'],
['Tungurahua',.56,'s','ADCES','100,62 120,68 118,80 105,82 105,72'],
['Zamora Chinchipe',.12,'a','XWHRE','100,128 125,140 130,165 112,185 95,180 90,168 98,150']];
const LEAN={c:[.25,.1,.35,0],s:[-.2,.2,-.1,.25],a:[.1,.35,.2,.5],g:[-.1,-.4,-.3,-.2]};
const hs=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))%997,7);
const LN=PV.map(p=>LEAN[p[2]].map((v,k)=>Math.max(-1,Math.min(1,v+(((hs(p[0])*(k+3))%100)/100-.5)*.3))));
const PRE={'Liberal de mercado':[.7,-.3,-.3,-.4],'Socialdemócrata':[-.5,-.4,-.2,0],'Centrista':[0,0,0,0],'Conservador nacionalista':[.3,.7,.5,.6],'Populista de izquierda':[-.7,.1,.3,.5]};
const AIP=[['Alianza Renovación Nacional','ARN','#e63946','Rodrigo Valdivieso',[.7,.3,.3,.1],{c:.2}],['Movimiento Raíces del Pueblo','MRP','#2a9d8f','Carmen Yumbay',[-.6,-.1,-.1,.5],{s:.2,a:.15}],['Unión Verde y Progreso','UVP','#7bc043','Andrés Lasso',[-.3,-.7,-.5,-.3],{g:.2,s:.05}],['Frente Orden y Patria','FOP','#f4a261','Gral. Mauricio Ponce',[.3,.8,.8,.7],{c:.12,a:.1}]];
// Debate: 5 preguntas x 7 respuestas (v1; ampliable a 50). Respuesta k=0..6 ↔ posición -1..+1 en el eje.
const QS=[
{t:'Economía',ax:0,q:'El déficit fiscal sigue alto y la deuda crece. ¿Cómo lo enfrenta?',a:['Gravar con fuerza grandes patrimonios y estatizar sectores estratégicos.','Subir impuestos a los ingresos altos y blindar el gasto social.','Más recaudación progresiva y una inversión pública selectiva.','Ordenar el gasto, mejorar la recaudación y renegociar plazos de deuda.','Recortar gasto corriente e incentivar la inversión privada con reglas claras.','Reducir impuestos y privatizar empresas públicas deficitarias.','Achicar el Estado al mínimo: dolarización estricta, privatización total y cero déficit.']},
{t:'Seguridad',ax:2,q:'Las bandas criminales controlan cárceles y barrios. ¿Qué haría?',a:['Desmilitarizar: prevención, reinserción y cero estado de excepción.','Inversión social en barrios y justicia restaurativa, con policía comunitaria.','Fortalecer inteligencia y fiscalía con control judicial estricto.','Mezclar prevención, control de cárceles y cooperación internacional.','Estado de excepción acotado y por tiempo, con control legislativo.','Mano dura: militares en calles y cárceles de máxima seguridad.','Pena máxima, restricción de garantías y control total de fronteras.']},
{t:'Familia y sociedad',ax:1,q:'¿Cómo debe el Estado tratar los derechos civiles y la familia?',a:['Ampliar derechos civiles y educación sexual integral sin restricciones.','Reconocer nuevos derechos y proteger la diversidad familiar.','Defender derechos individuales con apoyo a todas las familias.','Dejar la decisión a consultas y al consenso social.','Proteger el modelo familiar tradicional sin retroceder en derechos básicos.','Priorizar valores familiares y la educación moral en las escuelas.','Restringir leyes que contradigan la familia tradicional y la fe mayoritaria.']},
{t:'Energía y recursos',ax:3,q:'¿Qué hacer con el petróleo y la minería en la Amazonía?',a:['Abrir a inversión extranjera con arbitraje internacional.','Concesionar con estándares ambientales internacionales.','Alianzas público-privadas con transferencia tecnológica.','Mantener operaciones actuales y revisar contratos caso a caso.','Recuperar mayor control estatal sobre contratos estratégicos.','Reservar los recursos para empresas nacionales y reinversión local.','Nacionalizar los recursos estratégicos y rechazar tutela externa.']},
{t:'Salud',ax:0,q:'Hospitales sin medicinas y listas de espera. ¿Cuál es su solución?',a:['Sistema único estatal, gratuito y financiado con impuestos a la riqueza.','Más presupuesto público y compra centralizada de medicinas.','Reforzar la red pública con apoyo de convenios privados.','Gestión por resultados en la red pública y compra transparente.','Vouchers para atenderse en clínicas privadas con pago estatal.','Seguros privados con subsidio solo a los más pobres.','Salud privatizada con seguros obligatorios y competencia total.']}];
const EVT=[['Protestas por el costo de vida','D',.12],['Ola de violencia criminal','S',.12],['Deslave bloquea una vía principal','I',.12],['Paro de transportistas','M',.1],['Crisis de agua y servicios','P',.1],['Inundaciones por fuerte temporada de lluvias','K',.12]];
let G=null,tab='panel',D=null;
const dist=(a,b)=>a.reduce((s,x,i)=>s+Math.abs(x-b[i]),0)/4;
const sev=p=>{const i=PV[p][3].indexOf('S');return i<0?0:G.sev[p][i]/100};
function poll(p){const r=PV[p][2];const sc=G.pt.map((x,i)=>-2*dist(x.ideo,LN[p])+G.C[i][p]+G.Nz[i][p]+(x.appr-.5)*1.2+(x.reg[r]||0)+sev(p)*x.ideo[2]*.2);const m=Math.max(...sc),e=sc.map(v=>Math.exp((v-m)*2.2)),t=e.reduce((a,b)=>a+b),u=Math.max(.02,.1-G.w*.0015);return e.map(v=>v/t*(1-u)).concat(u)}
function recalc(){G.PL=PV.map((_,p)=>poll(p));const tp=PV.reduce((s,p)=>s+p[1],0);G.nat=G.pt.map((_,i)=>PV.reduce((s,p,k)=>s+p[1]*G.PL[k][i],0)/tp)}
function newGame(){ME=0;MP=null;const f=$('#nm'),i=PRE[$('#pr').value];G={w:0,start:Date.UTC(2026,10,16),elec:40,sel:9,hum:[0],diff:$('#df').value,done:null,hist:[],ih:[],news:[],log:[],stance:[[],[],[],[]],lastDeb:-9,sev:PV.map((p,k)=>[...p[3]].map((_,j)=>25+(hs(p[0]+j)%45))),
pt:[{n:f.value||'Mi Partido',s:($('#sg').value||'MPP').toUpperCase().slice(0,5),c:$('#cl').value,l:$('#ld').value||'Tú',ideo:[...i],money:300,appr:.5,reg:{},ap:5,rs:{d:[],cur:null,left:0}}].concat(AIP.map(a=>({n:a[0],s:a[1],c:a[2],l:a[3],ideo:[...a[4]],money:200+R()*150,appr:.5,reg:a[5],ap:5,rs:{d:[],cur:null,left:0}})))};
G.C=G.pt.map(()=>PV.map(()=>0));G.Nz=G.pt.map(()=>PV.map(()=>(R()-.5)*.3));
if(G.diff=='f')G.C[ME]=PV.map(()=>.12);if(G.diff=='d')G.C[ME]=PV.map(()=>-.1);
recalc();snap();news('Arranca la precampaña presidencial. '+G.pt.length+' partidos compiten en las 24 provincias.');tab='panel';ui()}
const date=()=>new Date(G.start+G.w*7*864e5).toLocaleDateString('es-EC',{day:'numeric',month:'short',year:'numeric'});
function news(t){G.news.unshift([date(),t]);G.news=G.news.slice(0,60)}
function snap(){G.hist.push(G.nat.slice());G.ih.push(G.pt[ME].ideo.slice())}
function adv(n){if(!G||G.done)return;if(MP&&ME!=0)return alert('Solo el anfitrión avanza el tiempo.');if(G.pt[ME].ev!=null)return alert('Responde primero al evento pendiente.');for(let k=0;k<n&&G.w<G.elec;k++)tick();if(G.w>=G.elec)runElection();recalc();ui()}
function tick(){G.w++;G.pt.forEach(x=>x.ap=5);recalc();const lead=G.nat.indexOf(Math.max(...G.nat));
G.pt.forEach((x,i)=>{x.money+=G.hum.includes(i)?25+G.nat[i]*60:22+x.money*.002;x.appr+=(.5-x.appr)*.05;
if(!G.hum.includes(i)){G.C[i]=G.C[i].map(v=>v*.97);if(x.money>90){let b=0,bs=-9;PV.forEach((p,k)=>{const sc=p[1]*(G.PL[k][lead]-G.PL[k][i]+.05)*(G.PL[k][i]>.12?1:.4);if(sc>bs){bs=sc;b=k}});G.C[i][b]+=.2;x.money-=60}
x.ideo=x.ideo.map((v,a)=>v+(G.pt[lead].ideo[a]-v)*.008);if(R()<.03){x.appr-=.1;news('Escándalo: '+x.s+' enfrenta denuncias por manejo de fondos de campaña.')}}
else G.C[i]=G.C[i].map(v=>v*.97)});
G.Nz=G.Nz.map(r=>r.map(v=>v*.9+(R()-.5)*.06));
if(!G.hum.includes(lead)&&R()<.25){const r=G.pt[lead];G.pt[ME].appr-=.015;news(r.s+' critica a '+G.pt[ME].s+' y cuestiona su plan de gobierno.')}
else if(G.hum.includes(lead)&&R()<.3){const r=1+Math.floor(R()*4);G.pt[ME].appr-=.02;news(G.pt[r].s+' ataca a '+G.pt[ME].s+' por ser el favorito en las encuestas.')}
if(R()<.3){const e=EVT[Math.floor(R()*EVT.length)],p=Math.floor(R()*24),j=PV[p][3].indexOf(e[1]);if(j>=0){G.sev[p][j]=Math.min(95,G.sev[p][j]+10);G.pt.forEach((x,i)=>{if(e[1]=='S')G.C[i][p]+=x.ideo[2]*.08});news(e[0]+' en '+PV[p][0]+': el problema «'+PN[e[1]]+'» se agrava.')}}
G.sev=G.sev.map(r=>r.map(v=>Math.max(5,Math.min(98,v+(R()-.52)*2))));
G.hum.forEach(rsTick);evTick();recalc();snap()}
function act(k){const P=G.pt[ME],p=G.sel,costs=[40,150,0,60,0],ap=[1,2,1,2,2];if(G.pt[ME].ap<ap[k]||P.money<costs[k])return;G.pt[ME].ap-=ap[k];P.money-=costs[k];
if(k==0){G.C[ME][p]+=.35;news('Mitin de '+P.s+' en '+PV[p][0]+'.')}
if(k==1){G.C[ME]=G.C[ME].map(v=>v+.08);news(P.s+' lanza publicidad nacional.')}
if(k==2){const d=(R()-.45)*.2;G.C[ME]=G.C[ME].map(v=>v+d);P.appr+=d*.1;news('Entrevista de '+P.l+': '+(d>0?'buena recepción.':'declaraciones polémicas.'))}
if(k==3){const j=G.sev[p].indexOf(Math.max(...G.sev[p])),s=G.sev[p][j]/100;G.C[ME][p]+=.15+s*.35;G.sev[p][j]=Math.max(5,G.sev[p][j]-3);news(P.s+' presenta plan para «'+PN[PV[p][3][j]]+'» en '+PV[p][0]+'.')}
if(k==4){const m=60+R()*140;P.money+=m;P.appr-=.01;news(P.s+' recauda '+fm(m)+' en donaciones.')}
G.log.push([date(),'Acción '+k+' en '+PV[p][0]]);recalc();ui()}
// Elecciones (presidencial: 1ª vuelta ≥50% o ≥40% con 10 pts; si no, balotaje). Legislativas: no implementadas aún.
function tally(f,over){const tp=PV.reduce((s,p)=>s+p[1],0);return G.pt.map((_,i)=>PV.reduce((s,p,k)=>s+p[1]*f(k)[i],0)/tp)}
function runElection(){const sh=k=>{const a=G.PL[k].slice(0,5),t=a.reduce((x,y)=>x+y);return a.map(v=>v/t)};const n1=tally(sh);const o=n1.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]);let win=null,n2=null;
if(o[0][0]>=.5||(o[0][0]>=.4&&o[0][0]-o[1][0]>=.1))win=o[0][1];else{const a=o[0][1],b=o[1][1];const r2=k=>{const s=sh(k);let va=s[a],vb=s[b];s.forEach((v,j)=>{if(j!=a&&j!=b){const wa=Math.exp(-3*dist(G.pt[j].ideo,G.pt[a].ideo)),wb=Math.exp(-3*dist(G.pt[j].ideo,G.pt[b].ideo));va+=v*wa/(wa+wb);vb+=v*wb/(wa+wb)}});const r=[];r[a]=va;r[b]=vb;return G.pt.map((_,i)=>r[i]||0)};n2=tally(r2);win=n2[a]>n2[b]?a:b;G.run=[a,b]}
const wins=G.pt.map(()=>0);PV.forEach((_,k)=>{const s=sh(k);wins[s.indexOf(Math.max(...s))]++});
G.done={n1,n2,win,wins};G.seatsF=seats();news('ELECCIONES: gana '+G.pt[win].n+(n2?' en segunda vuelta.':' en primera vuelta.'));tab='panel'}
function save(){try{localStorage.setItem('pws_ec',JSON.stringify(G));alert('Partida guardada.')}catch(e){alert('No se pudo guardar.')}}
function load(){try{const s=localStorage.getItem('pws_ec');if(!s)return alert('No hay partida guardada.');G=JSON.parse(s);recalc();tab='panel';ui()}catch(e){alert('No se pudo cargar.')}}
// ---- UI
const TABS=[['panel','Panel'],['mapa','Mapa y territorios'],['camp','Campaña'],['deb','Debate'],['inv','Investigación'],['parl','Asamblea'],['perfil','Perfil ideológico'],['part','Partidos'],['noti','Noticias']];
const bar=(v,c,l)=>`<div class="mu">${l}</div><div class="bar"><i style="width:${Math.min(100,v*100)}%;background:${c}"></i></div>`;
function line(ser,cols,h){const w=300,H=h||110;const mx=Math.max(.01,...ser.flat()),mn=Math.min(0,...ser.flat());const n=ser[0].length;return `<svg viewBox="0 0 ${w} ${H}" style="width:100%">${ser.map((s,i)=>`<polyline fill="none" stroke="${cols[i]}" stroke-width="2" points="${s.map((v,k)=>(n>1?k/(n-1)*w:0).toFixed(1)+','+(H-6-(v-mn)/(mx-mn)*(H-12)).toFixed(1)).join(' ')}"/>`).join('')}</svg>`}
function ui(){if(!G){$('#nv').innerHTML='';$('#hd').innerHTML='';return setup()}

$('#nv').innerHTML=TABS.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="tab='${t[0]}';ui()">${t[1]}</button>`).join('');
$('#v').innerHTML=evBox()+({panel,mapa,camp,deb,inv,parl,perfil,part,noti})[tab]();if(tab=='mapa')bindMap()}
function setup(){$('#v').innerHTML=`<div class="c" style="max-width:520px;margin:20px auto"><h3>Nueva partida — Ecuador</h3><p class="mu">Elecciones presidenciales y legislativas en ~40 semanas. Población aproximada.</p>

function panel(){const o=G.nat.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]);let h='';
if(G.done){const d=G.done;h+=`<div class="c"><h3>🗳️ Resultado electoral</h3><p><b>Presidente electo: ${G.pt[d.win].n}</b> (${G.pt[d.win].l})</p>${d.win==ME?'<p>¡Ganaste! (La fase de gobierno aún no está implementada.)</p>':'<p>Perdiste. Puedes iniciar otra partida.</p>'}<div class="ov"><table><tr><th>Partido</th><th>1ª vuelta</th>${d.n2?'<th>2ª vuelta</th>':''}<th>Provincias ganadas</th></tr>${G.pt.map((x,i)=>`<tr><td style="color:${x.c}">${x.s}</td><td>${pc(d.n1[i])}</td>${d.n2?`<td>${d.n2[i]?pc(d.n2[i]):'—'}</td>`:''}<td>${d.wins[i]}</td></tr>`).join('')}</table></div><br><button onclick="G=null;ui()">Nueva partida</button></div>`}
return h+`<div class="gr"><div class="c"><h3>Encuesta nacional</h3>${o.map(([v,i])=>bar(v/Math.max(...G.nat),G.pt[i].c,`${G.pt[i].s} — ${pc(v)}`)).join('')}<div class="mu">Los demás son indecisos. Tu puesto: ${o.findIndex(x=>x[1]==ME)+1}º</div></div>
<div class="c"><h3>Evolución de encuestas</h3>${line(G.pt.map((_,i)=>G.hist.map(h=>h[i])),G.pt.map(x=>x.c))}<div class="mu">${G.pt.map(x=>`<span style="color:${x.c}">■</span> ${x.s}`).join(' ')}</div></div>
<div class="c"><h3>Noticias recientes</h3>${G.news.slice(0,5).map(n=>`<div><span class="mu">${n[0]}</span> ${n[1]}</div>`).join('')}</div></div>`}
function mapa(){const mode=G.mm||'w';const paths=PV.map((p,k)=>{const s=G.PL[k],m=Math.max(...s.slice(0,5)),w=s.indexOf(m),o=s.slice(0,5).sort((a,b)=>b-a);let col,op;if(mode=='w'){col=G.pt[w].c;op=Math.min(1,.4+(o[0]-o[1])*3.5)}else{col=G.pt[ME].c;op=.12+s[ME]*2.2}

const k=G.sel,s=G.PL[k],ps=PV[k];
return `<div class="gr" style="grid-template-columns:minmax(300px,1.5fr) minmax(260px,1fr)"><div class="c"><h3>Mapa político — intención de voto <button class="g" onclick="G.mm=G.mm=='w'?'p':'w';ui()">Vista: ${mode=='w'?'ganador':'mi apoyo'}</button></h3><svg viewBox="-5 -5 195 205" style="width:100%;max-height:560px">${paths}<text x="2" y="160" font-size="7" fill="currentColor">Galápagos</text></svg><div class="mu">Pasa el mouse para ver porcentajes; clic para seleccionar. ${GEO.some(Boolean)?'Límites reales de provincias (datos: simplemaps.com).':'Mapa esquemático: importa un GeoJSON de provincias para ver los límites reales.'}<br><label style="display:inline">Importar GeoJSON <input type="file" accept=".geojson,.json" onchange="importGeo(this)" style="width:auto"></label></div></div>
<div class="c"><h3>${ps[0]}</h3><div class="mu">Población aprox. ${ps[1]} M · ${{c:'Costa',s:'Sierra',a:'Amazonía',g:'Insular'}[ps[2]]}</div>${s.slice(0,5).map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]).map(([v,i])=>bar(v/.6,G.pt[i].c,`${G.pt[i].s} ${pc(v)}`)).join('')}<div class="mu">Indecisos ${pc(s[5])}</div><h3 style="margin-top:12px">5 problemas principales</h3>${[...ps[3]].map((c,j)=>bar(G.sev[k][j]/100,G.sev[k][j]>65?'#e63946':G.sev[k][j]>45?'#f4a261':'#2a9d8f',`${PN[c]} — gravedad ${Math.round(G.sev[k][j])}`)).join('')}<button onclick="tab='camp';ui()">Hacer campaña aquí</button></div></div>`}
function bindMap(){const t=$('#tip');document.querySelectorAll('path.pv').forEach(el=>{const k=+el.dataset.k;el.onmousemove=e=>{const s=G.PL[k];t.style.display='block';t.style.left=Math.min(innerWidth-220,e.clientX+14)+'px';t.style.top=(e.clientY+14)+'px';t.innerHTML=`<b>${PV[k][0]}</b><br>`+s.slice(0,5).map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]).map(([v,i])=>`<span style="color:${G.pt[i].c}">■</span> ${G.pt[i].s}: ${pc(v)}`).join('<br>')+`<br><span class="mu">Indecisos: ${pc(s[5])}</span>`};el.onmouseleave=()=>t.style.display='none';el.onclick=()=>{G.sel=k;t.style.display='none';ui()}})}
function camp(){const A=[['Mitin en la provincia',40,1,'+apoyo local'],['Publicidad nacional',150,2,'+apoyo en todo el país'],['Entrevista',0,1,'riesgo: puede salir bien o mal'],['Propuesta territorial (problema más grave)',60,2,'+apoyo local y alivia el problema'],['Recaudar fondos',0,2,'+dinero, cuesta algo de imagen']];
return `<div class="c"><h3>Campaña</h3><label>Provincia objetivo</label><select onchange="G.sel=+this.value;ui()">${PV.map((p,k)=>`<option value="${k}" ${k==G.sel?'selected':''}>${p[0]} — tú: ${pc(G.PL[k][ME])}</option>`)}</select><p class="mu">Puntos de agenda esta semana: ${G.pt[ME].ap}. Se renuevan cada semana.</p>${A.map((a,k)=>`<div style="margin:6px 0"><button ${(G.pt[ME].ap<a[2]||G.pt[ME].money<a[1]||G.done)?'disabled':''} onclick="act(${k})">${a[0]}</button> <span class="mu">${fm(a[1])} · ${a[2]} pts · ${a[3]}</span></div>`).join('')}<button class="g" onclick="adv(1)">Terminar semana</button></div>`}
function deb(){if(G.done)return'<div class="c">La campaña terminó.</div>';
if(!D){const ok=G.w>=32&&G.w<=38&&G.lastDeb<0&&G.pt[ME].ap>=2;return `<div class="c"><h3>Debate presidencial</h3><p>Responderás 5 preguntas con 15 s cada una. Tus respuestas mueven tu ideología, tu credibilidad y el apoyo territorial según lo que piense cada provincia. Rápido = atención, pero arriesgado; sin respuesta = pierdes credibilidad. El debate presidencial se celebra entre las semanas 32 y 38, ya en la recta final. Cuesta 2 pts de agenda y solo participas una vez.</p><button ${ok?'':'disabled'} onclick="startDeb()">Entrar al debate</button> <span class="mu">${ok?'':'Se abre en la semana 32 (una sola oportunidad).'}</span><p class="mu">v1: 5 preguntas × 7 respuestas (el banco de 50 está pendiente).</p></div>`}

const q=QS[D.q[D.i]];

function startDeb(){G.pt[ME].ap-=2;G.lastDeb=G.w;D={q:[0,1,2,3,4].sort(()=>R()-.5).slice(0,5),i:0,sc:0,out:[]};timer();ui()}
function timer(){D.t0=Date.now();clearInterval(D.iv);D.iv=setInterval(()=>{const e=(Date.now()-D.t0)/1000,b=$('#tb');if(b)b.style.width=Math.max(0,100-e/15*100)+'%';if(e>=15){clearInterval(D.iv);ans(-1)}},200)}
function ans(k){clearInterval(D.iv);const q=QS[D.q[D.i]],P=G.pt[ME],ax=q.ax,el=(Date.now()-D.t0)/1000;let fb='';
if(k<0){P.appr-=.03;D.sc-=5;D.fb='⏱️ Se acabó el tiempo: pierdes credibilidad.';D.out.push('Sin respuesta en «'+q.t+'»');return ui()}
const v=(k-3)/3,pr=(G.pt[ME].st=G.pt[ME].st||[[],[],[],[]])[ax],contra=pr.length&&Math.abs(pr[pr.length-1]-v)>1.2;pr.push(v);let coh=1-Math.min(1,Math.abs(v-P.ideo[ax])/1.4)-(contra?.5:0),att=el<5?.25:el<11?0:-.1;
if(el<5&&coh<.4&&R()<.4){coh-=.3;fb+='Respuesta precipitada: se trabó. '}
G.C[ME]=G.C[ME].map((c,p)=>c+((1-Math.abs(v-LN[p][ax])/2)-.55)*.2*(1+att));P.appr+=coh*.012-.004;D.sc+=coh*6+att*6+3;P.ideo[ax]+=.2*(v-P.ideo[ax]);
const r=1+Math.floor(R()*4),X=G.pt[r],d=Math.abs(v-X.ideo[ax]);
fb+=`Coherencia ${Math.round(Math.max(0,coh)*100)}%, tiempo ${el.toFixed(1)} s. <br><br><b style="color:${X.c}">${X.s}</b> (${X.l}): `+(contra?'«Hace unas semanas usted dijo lo contrario sobre este tema.»':d>.7?'«No comparto esa postura; ignora a quienes representamos.»':'«Coincidimos en parte, pero no explicó cómo se financia.»');
if(contra){P.appr-=.02}D.out.push(q.t+': '+(coh>.5?'respuesta coherente':'poco coherente con tu perfil')+(contra?' · contradicción explotada por '+X.s:''));D.fb=fb;recalc();ui()}

async function mpJoin(){if(!DB)return alert(NODB);const code=($('#rc').value||'').trim().toUpperCase();try{const s=await DB.doc('rooms/'+code).get();if(!s.exists)return alert('Sala no encontrada.');G=JSON.parse(s.data().g);const i=[1,2,3,4].find(k=>!G.hum.includes(k));if(i==null)return alert('Sala llena (5 partidos).');const x=G.pt[i];x.n=$('#nm').value||x.n;x.s=($('#sg').value||x.s).toUpperCase().slice(0,5);x.c=$('#cl').value;x.l=$('#ld').value||'Tú';x.ideo=[...PRE[$('#pr').value]];x.reg={};x.money=300;G.hum.push(i);ME=i;MP={code};recalc();push();mpSub();tab='panel';ui()}catch(e){alert('No se pudo unir a la sala.')}}
// Investigación: [rama, nombre, costo, semanas, requisito, eje ideológico, delta, problema que atiende]
const RT=[['Economía','Reforma tributaria progresiva',80,4,'',0,-.2,'G'],['Economía','Incentivos a la inversión privada',70,4,'',0,.2,'D'],['Economía','Disciplina fiscal',90,5,'',0,.15,'P'],['Economía','Programa de empleo juvenil',110,6,'Incentivos a la inversión privada',0,-.1,'D'],['Seguridad','Reforma penitenciaria',100,5,'',2,.1,'S'],['Seguridad','Policía comunitaria y prevención',80,4,'',2,-.2,'S'],['Seguridad','Inteligencia financiera contra el crimen',120,6,'Reforma penitenciaria',2,.15,'S'],['Salud','Compra centralizada de medicinas',90,4,'',0,-.15,'H'],['Salud','Red hospitalaria regional',140,7,'Compra centralizada de medicinas',0,-.1,'H'],['Educación','Becas y conectividad escolar',90,5,'',1,-.15,'E'],['Educación','Reforma curricular técnica',100,5,'Becas y conectividad escolar',1,.1,'E'],['Infraestructura','Plan vial nacional',130,7,'',0,.05,'I'],['Infraestructura','Agua potable y saneamiento',110,6,'',0,-.05,'P'],['Agro','Riego y crédito para pequeños agricultores',90,5,'',0,-.1,'A'],['Energía','Transición a energías renovables',140,7,'',3,-.15,'C'],['Energía','Reforma de contratos petroleros',100,5,'',3,.25,'X'],['Política exterior','Acuerdos comerciales regionales',80,5,'',3,-.2,'D'],['Instituciones','Reforma anticorrupción y transparencia',90,5,'',2,-.2,'P'],['Ambiente','Protección de la Amazonía y los páramos',90,5,'',3,-.1,'X'],['Migración','Plan de integración y retorno',80,5,'',1,-.1,'N']];
function rsStart(k){const x=G.pt[ME],t=RT[k];if(x.rs.cur!=null||x.rs.d.includes(k)||x.money<t[2])return;if(t[4]&&!x.rs.d.some(j=>RT[j][1]==t[4]))return;x.money-=t[2];x.rs.cur=k;x.rs.left=t[3];ui()}
function rsTick(i){const x=G.pt[i],r=x.rs;if(r.cur==null)return;if(--r.left>0)return;const t=RT[r.cur];r.d.push(r.cur);r.cur=null;x.ideo[t[5]]=cl1(x.ideo[t[5]]+t[6]*.6);PV.forEach((p,k)=>{const j=p[3].indexOf(t[7]);if(j>=0){G.C[i][k]+=.12;G.sev[k][j]=Math.max(5,G.sev[k][j]-7)}});if(R()<.3){x.appr-=.03;news(x.s+' completa «'+t[1]+'», pero genera controversia.')}else{x.appr+=.01;news(x.s+' presenta su política «'+t[1]+'».')}}
function inv(){const x=G.pt[ME],r=x.rs;const br=[...new Set(RT.map(t=>t[0]))];return `<div class="c"><h3>Árbol de investigación</h3><p class="mu">Una investigación a la vez. Al terminar, la política entra a tu programa: mueve tu ideología, mejora tu apoyo donde ese problema pesa y reduce su gravedad. Puede generar controversia.${r.cur!=null?` <b>En curso: ${RT[r.cur][1]} (${r.left} sem)</b>`:''}</p></div><div class="gr">${br.map(b=>`<div class="c"><h3>${b}</h3>${RT.map((t,k)=>[t,k]).filter(([t])=>t[0]==b).map(([t,k])=>{const ok=!t[4]||r.d.some(j=>RT[j][1]==t[4]);return `<div style="margin:6px 0"><b>${t[1]}</b> <span class="mu">${fm(t[2])} · ${t[3]} sem · ${AX[t[5]].split(' ')[0]} ${t[6]>0?'+':''}${t[6]} · problema: ${PN[t[7]]}${t[4]?' · req: '+t[4]:''}</span><br>${r.d.includes(k)?'✅ Completada':`<button ${(!ok||r.cur!=null||x.money<t[2])?'disabled':''} onclick="rsStart(${k})">Investigar</button>`}</div>`}).join('')}</div>`).join('')}</div>`}
// Eventos con decisión: [opción, costo, aprobación, campaña, eje, delta ideológico]
const EV=[['Paro nacional de transportistas por el precio del combustible',[['Subsidiar el combustible',120,.03,.05,0,-.1],['Negociar sin subsidio',0,-.01,-.04,0,.1],['Declarar estado de excepción',0,-.04,.02,2,.2]]],['Escándalo de corrupción en una entidad pública',[['Pedir una investigación independiente',20,.02,.03,2,-.15],['Defender a los funcionarios',0,-.05,-.03,2,.1],['Mantenerte al margen',0,-.02,0,2,0]]],['Cae el precio del petróleo y se recortan los ingresos del Estado',[['Proponer ajuste y austeridad',0,-.02,-.02,0,.2],['Proponer más impuestos a los ricos',0,.01,.02,0,-.2],['Pedir deuda a organismos internacionales',0,0,0,3,-.1]]],['Un sismo causa daños en la Sierra',[['Visitar la zona y donar fondos',80,.04,.04,1,-.05],['Proponer un fondo nacional de reconstrucción',0,.02,.03,0,-.1],['Enviar condolencias',0,0,0,1,0]]],['Ola de violencia en las cárceles',[['Pedir intervención militar',0,.01,.03,2,.3],['Pedir reforma penitenciaria y rehabilitación',0,.01,.02,2,-.2],['Criticar al gobierno de turno',0,-.01,.01,2,0]]],['Crisis migratoria en la frontera norte',[['Cierre y control fronterizo',0,0,.03,3,.3],['Plan humanitario con apoyo internacional',40,.01,-.01,3,-.3],['Política migratoria mixta',0,.01,.01,1,0]]],['Protestas sociales por el costo de vida',[['Apoyar las demandas',0,.03,.03,0,-.2],['Pedir diálogo y orden',0,0,0,2,.1],['Condenar la violencia de los manifestantes',0,-.02,.02,2,.3]]]];
function evTick(){G.hum.forEach((i,n)=>{const x=G.pt[i];if(x.ev==null&&R()<.1){x.ev=Math.floor(R()*EV.length);if(!n)news('Evento: '+EV[x.ev][0]+'.')}})}
function evPick(k){const x=G.pt[ME];if(x.ev==null)return;const e=EV[x.ev][1][k];if(x.money<e[1])return;x.money-=e[1];x.appr+=e[2]+(R()-.5)*.04;G.C[ME]=G.C[ME].map(v=>v+e[3]*(.6+R()*.8));x.ideo[e[4]]=cl1(x.ideo[e[4]]+e[5]*.15);news(x.s+' responde al evento: '+e[0].toLowerCase()+'.');x.ev=null;recalc();ui()}
function evBox(){const x=G.pt[ME];if(!x||x.ev==null||G.done)return'';const e=EV[x.ev];return `<div class="c" style="border-color:#e63946"><h3>⚠️ Evento: ${e[0]}</h3>${e[1].map((o,k)=>`<button class="ans" ${x.money<o[1]?'disabled':''} onclick="evPick(${k})">${o[0]} <span class="mu">${o[1]?fm(o[1]):''}</span></button>`).join('')}<div class="mu">Los resultados tienen margen de incertidumbre. Debes decidir antes de avanzar el tiempo.</div></div>`}
// Asamblea Nacional (cámara única, sin Senado): 15 nacionales + 2 por provincia + 1 por cada ~200 mil hab. (aprox.), Sainte-Laguë
const ST=p=>2+Math.round(PV[p][1]/.2);
function sl(v,n){const s=v.map(()=>0);for(let k=0;k<n;k++){let b=0,m=-1;v.forEach((x,i)=>{const q=x/(2*s[i]+1);if(q>m){m=q;b=i}});s[b]++}return s}
function seats(){const sh=k=>{const a=G.PL[k].slice(0,5),t=a.reduce((x,y)=>x+y);return a.map(v=>v/t)};const tot=G.pt.map(()=>0);PV.forEach((_,k)=>sl(sh(k),ST(k)).forEach((s,i)=>tot[i]+=s));sl(tally(sh),15).forEach((s,i)=>tot[i]+=s);return tot}
function parl(){const t=G.seatsF||seats(),T=t.reduce((a,b)=>a+b),maj=Math.floor(T/2)+1,w=G.done?G.done.win:t.indexOf(Math.max(...t));return `<div class="c ov"><h3>Asamblea Nacional ${G.done?'(resultado)':'(proyección con las encuestas actuales)'}</h3><div class="mu">Cámara única, sin Senado. ${T} escaños (15 nacionales + provinciales según población, cifras aproximadas), método Sainte-Laguë. Mayoría: ${maj}.</div><div style="display:flex;height:22px;border-radius:6px;overflow:hidden;margin:8px 0">${t.map((s,i)=>`<i style="width:${s/T*100}%;background:${G.pt[i].c}"></i>`).join('')}</div><table><tr><th>Partido</th><th>Escaños</th><th>%</th></tr>${G.pt.map((x,i)=>`<tr><td style="color:${x.c}"><b>${x.s}</b></td><td>${t[i]}</td><td>${pc(t[i]/T)}</td></tr>`).join('')}</table><p>${t[w]>=maj?G.pt[w].s+' tendría mayoría propia: gobernaría sin depender de nadie.':G.pt[w].s+' necesitaría '+(maj-t[w])+' escaños más: tendría que negociar alianzas en la Asamblea.'}</p></div>`}
// Importar GeoJSON real de provincias
function importGeo(el){const f=el.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result),nz=v=>String(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(),idx=PV.map(p=>nz(p[0])),m=[];(j.features||[]).forEach(ft=>{const vs=Object.values(ft.properties||{}).map(nz);let k=idx.findIndex(n=>vs.includes(n));if(k<0)k=idx.findIndex(n=>vs.some(v=>v.length>4&&(n.startsWith(v)||(n=='galapagos'&&v.includes('colon')))));if(k>=0){const g=ft.geometry,rs=g.type=='Polygon'?g.coordinates:g.coordinates.flat();(m[k]=m[k]||[]).push(...rs)}});const cnt=m.filter(Boolean).length;if(cnt<10)return alert('Solo reconocí '+cnt+' provincias. El GeoJSON debe tener los nombres de provincia en sus propiedades.');const b=(ks)=>{let a=[1e9,-1e9,1e9,-1e9];ks.forEach(k=>m[k]&&m[k].forEach(r=>r.forEach(c=>{a=[Math.min(a[0],c[0]),Math.max(a[1],c[0]),Math.min(a[2],c[1]),Math.max(a[3],c[1])]})));return a},ks=PV.map((_,k)=>k).filter(k=>k!=8),B=b(ks),s1=Math.min(180/(B[1]-B[0]),195/(B[3]-B[2])),GB=b([8]),s2=Math.min(30/(GB[1]-GB[0]||1),26/(GB[3]-GB[2]||1));const geo=PV.map((_,k)=>{if(!m[k])return'';const g=k==8;return m[k].map(r=>{const st=Math.ceil(r.length/300);return r.filter((_,i)=>i%st==0).map((c,i)=>(i?'L':'M')+(g?(c[0]-GB[0])*s2+2:(c[0]-B[0])*s1).toFixed(1)+','+(g?(GB[3]-c[1])*s2+162:(B[3]-c[1])*s1).toFixed(1)).join('')+'Z'}).join('')});GEO=geo;try{localStorage.setItem('pws_geo',JSON.stringify(geo))}catch(e){}alert('Importadas '+cnt+' provincias.');ui()}catch(e){alert('No se pudo leer el GeoJSON.')}};rd.readAsText(f)}
['act','ans','nextQ','adv','evPick','rsStart','startDeb'].forEach(n=>{const f=window[n];window[n]=function(...a){const r=f.apply(this,a);push();return r}});

ui();
